<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lead performance · Aaronz &amp; Co.</title>
    <!-- Starts downloading alongside the JS bundle rather than waiting for
         React to render the sidebar. Keep the ?v= in step with src/images.js. -->
    <link rel="preload" as="image" href="/images/aaronz-logo-white.png?v=2" />

    <!-- The wordmark is unreadable at 16px, so the tab carries a monogram in
         the same forest green as the sidebar. ?v= is bumped when the artwork
         changes: browsers cache favicons hard and otherwise keep the old one
         for weeks. -->
    <link rel="icon" href="/favicon.ico?v=2" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png?v=2" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/icon-16.png?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png?v=2" />
    <link rel="manifest" href="/site.webmanifest?v=2" />
    <meta name="theme-color" content="#0C2036" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
